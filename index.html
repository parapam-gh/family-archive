<title>Семейный архив</title>

<style>
:root{--bg:#F1EFEA;--ink:#1C1C1C;--muted:#5F5C58;--edge:#878480;--p:#7E2230;--m:#A9C0CB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:420px;margin:0 auto;padding:12vh 22px 40px}
h1{font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:0 0 10px;font-weight:800}
.lead{color:var(--muted);margin:0 0 26px}
.dots{display:flex;gap:6px;margin:0 0 18px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=password]{width:100%;min-height:48px;font:inherit;padding:10px 14px;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--ink);margin:0 0 16px}
input:focus{outline:3px solid var(--ink);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;margin:0 0 20px;font-size:15px;color:var(--muted)}
.row input{width:22px;height:22px;margin:0}
button{width:100%;min-height:50px;font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:24px;margin:14px 0 0;font-size:15px}
.msg.err{color:var(--p)}
.small{font-size:13px;color:var(--muted);margin-top:28px}
</style></head>
<body><main>
<div class="dots" aria-hidden="true"><i style="background:var(--p)"></i><i style="background:var(--m)"></i><i style="background:var(--ink)"></i></div>
<h1>Семейный архив</h1>
<p class="lead">Страница только для родных. Введите логин и пароль, которые вам прислали.</p>
<form id="f" autocomplete="on">
<label for="u">Логин</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
<label for="pw">Пароль</label><input id="pw" name="password" type="password" autocomplete="current-password" required>
<div class="row"><input id="rem" type="checkbox" checked><label for="rem" style="margin:0;font-weight:400">Запомнить на этом устройстве (не ставьте на чужом)</label></div>
<button id="go" type="submit">Войти</button>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</form>
<p class="small">Забыли пароль — напишите Анастасии.</p>
</main>

(function(){
  var enc = new TextEncoder(), msg = document.getElementById("msg"), go = document.getElementById("go");
  function ub(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function fails(){ try { return JSON.parse(localStorage.getItem("fa.fail") || "{}"); } catch(e){ return {}; } }
  function setFails(o){ try { localStorage.setItem("fa.fail", JSON.stringify(o)); } catch(e){} }
  var timer = null;
  function lockCheck(){
    var f = fails(), left = Math.ceil(((f.until || 0) - Date.now()) / 1000);
    if (left > 0){ go.disabled = true; say("Слишком много неверных попыток. Попробуйте через " + (left > 90 ? Math.ceil(left / 60) + " мин" : left + " с") + ".", true);
      clearTimeout(timer); timer = setTimeout(lockCheck, 1000); return true; }
    if (go.disabled && !go.dataset.busy){ go.disabled = false; say(""); }
    return false;
  }
  async function kek(pw, salt){
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:D.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function uid(login){ return hex(await crypto.subtle.digest("SHA-256", enc.encode("family-archive:" + login.trim().toLowerCase()))).slice(0, 24); }
  async function unwrap(login, pw){
    var u = D.users[await uid(login)];
    var k = await kek(pw, u ? ub(u.s) : ub(D.pad));            // неизвестный логин проверяется так же долго, как известный

  function mark(gc, who, how){

  var IMG_LOADER = "<link rel='icon' href='data:,'><style>img[src*='#fa:']{visibility:hidden}</style><script>(" + function(){
    var cache = {};

      if (!cache[id]) cache[id] = fetch("i/" + id + ".bin").then(function(r){ if (!r.ok) throw 0; return r.arrayBuffer(); })

  });
